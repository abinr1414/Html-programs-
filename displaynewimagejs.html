<html>
    <head>
        <title>change every color when clicking</title>
        <script type ="text/javascript">
            function over()
            {
                document.getElementById("key").innerHTML="Onmouseover event has occured ";

            }
            function out()
            {
                document.getElementById("key").innerHTML="Onmouse event has occured";

            }
        </script>
        </head>
        <body bgcolor="cyan">
            <h2 id="key" onmouseover= "over()" onmouseout="out()">
                original text
            </h2>
        </body>
    </head>

</html>
