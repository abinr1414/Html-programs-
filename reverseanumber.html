<html>
    <title>
        TO FIND THE REVERSE OF A NUMBER
    </title>
    <body>
        <h2>Find palindrome of a number</h2>
        <label>Enter a number:</label>
        <input type="number" id="num">
        <button onclick="reverse()">FIND</button>
        <p id="result"></p>
        <script>
            function reverse(){
                let num = parseInt(document.getElementById("num").value);
                let rev=0;
                
                while (num>0){
                    let digit=num%10;
                    rev=rev*10+digit;
                    num=Math.floor(num/10);
                }
               document.getElementById("result").innerHTML="Reversed num="+rev;
            }

           

        </script>
    </body>
</html>
